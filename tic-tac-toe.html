<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .info {
            color: #666;
            margin-bottom: 20px;
            font-size: 1.2em;
            height: 30px;
        }

        .status {
            font-weight: bold;
            color: #667eea;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
            margin: 20px 0;
            background-color: #667eea;
            padding: 5px;
            border-radius: 10px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: white;
            border: none;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            color: #333;
            transition: all 0.3s ease;
            border-radius: 8px;
        }

        .cell:hover {
            background-color: #f0f0f0;
            transform: scale(1.05);
        }

        .cell.x {
            color: #667eea;
        }

        .cell.o {
            color: #764ba2;
        }

        .button-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .reset-btn {
            background-color: #667eea;
            color: white;
        }

        .reset-btn:hover {
            background-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .mode-btn {
            background-color: #f0f0f0;
            color: #333;
        }

        .mode-btn:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px);
        }

        .mode-btn.active {
            background-color: #667eea;
            color: white;
        }

        .scores {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 20px;
            font-size: 1.1em;
            color: #333;
        }

        .score-item {
            font-weight: bold;
        }

        .score-value {
            color: #667eea;
            font-size: 1.3em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Tic Tac Toe</h1>
        <div class="info">
            <span class="status" id="status">Player X's Turn</span>
        </div>

        <div class="game-board" id="gameBoard">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <div class="scores">
            <div class="score-item">X Wins: <span class="score-value" id="xScore">0</span></div>
            <div class="score-item">Draws: <span class="score-value" id="drawScore">0</span></div>
            <div class="score-item">O Wins: <span class="score-value" id="oScore">0</span></div>
        </div>

        <div class="button-group">
            <button class="mode-btn active" id="humanBtn" onclick="setMode('human')">Human vs Human</button>
            <button class="mode-btn" id="aiBtn" onclick="setMode('ai')">vs AI</button>
            <button class="reset-btn" onclick="resetGame()">New Game</button>
        </div>
    </div>

    <script>
        const cells = document.querySelectorAll('.cell');
        const statusDisplay = document.getElementById('status');
        const xScoreDisplay = document.getElementById('xScore');
        const oScoreDisplay = document.getElementById('oScore');
        const drawScoreDisplay = document.getElementById('drawScore');
        const humanBtn = document.getElementById('humanBtn');
        const aiBtn = document.getElementById('aiBtn');

        let gameBoard = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let gameMode = 'human'; // 'human' or 'ai'
        let scores = { x: 0, o: 0, draw: 0 };

        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function setMode(mode) {
            gameMode = mode;
            if (mode === 'human') {
                humanBtn.classList.add('active');
                aiBtn.classList.remove('active');
            } else {
                aiBtn.classList.add('active');
                humanBtn.classList.remove('active');
            }
            resetGame();
        }

        function handleCellClick(e) {
            const index = parseInt(e.target.getAttribute('data-index'));

            if (gameBoard[index] !== '' || !gameActive) {
                return;
            }

            gameBoard[index] = currentPlayer;
            updateCell(index);

            if (checkWinner()) {
                statusDisplay.textContent = `Player ${currentPlayer} Wins! 🎉`;
                gameActive = false;
                scores[currentPlayer.toLowerCase()]++;
                updateScores();
                return;
            }

            if (gameBoard.every(cell => cell !== '')) {
                statusDisplay.textContent = "It's a Draw! 🤝";
                gameActive = false;
                scores.draw++;
                updateScores();
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusDisplay.textContent = `Player ${currentPlayer}'s Turn`;

            // AI move
            if (gameMode === 'ai' && currentPlayer === 'O' && gameActive) {
                setTimeout(makeAIMove, 500);
            }
        }

        function makeAIMove() {
            const emptyIndices = gameBoard
                .map((cell, index) => cell === '' ? index : null)
                .filter(val => val !== null);

            if (emptyIndices.length === 0) return;

            // Try to win
            for (let i of emptyIndices) {
                gameBoard[i] = 'O';
                if (checkWinner()) {
                    updateCell(i);
                    statusDisplay.textContent = "AI Wins! 🤖";
                    gameActive = false;
                    scores.o++;
                    updateScores();
                    return;
                }
                gameBoard[i] = '';
            }

            // Block player
            for (let i of emptyIndices) {
                gameBoard[i] = 'X';
                if (checkWinner()) {
                    gameBoard[i] = 'O';
                    updateCell(i);
                    currentPlayer = 'X';
                    statusDisplay.textContent = `Player ${currentPlayer}'s Turn`;
                    return;
                }
                gameBoard[i] = '';
            }

            // Take center
            if (emptyIndices.includes(4)) {
                gameBoard[4] = 'O';
                updateCell(4);
                currentPlayer = 'X';
                statusDisplay.textContent = `Player ${currentPlayer}'s Turn`;
                return;
            }

            // Take corner
            const corners = [0, 2, 6, 8].filter(i => emptyIndices.includes(i));
            if (corners.length > 0) {
                const index = corners[Math.floor(Math.random() * corners.length)];
                gameBoard[index] = 'O';
                updateCell(index);
                currentPlayer = 'X';
                statusDisplay.textContent = `Player ${currentPlayer}'s Turn`;
                return;
            }

            // Random
            const index = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            gameBoard[index] = 'O';
            updateCell(index);
            currentPlayer = 'X';
            statusDisplay.textContent = `Player ${currentPlayer}'s Turn`;
        }

        function updateCell(index) {
            cells[index].textContent = gameBoard[index];
            cells[index].classList.add(gameBoard[index].toLowerCase());
        }

        function checkWinner() {
            return winningConditions.some(condition => {
                const [a, b, c] = condition;
                return gameBoard[a] !== '' &&
                       gameBoard[a] === gameBoard[b] &&
                       gameBoard[a] === gameBoard[c];
            });
        }

        function resetGame() {
            gameBoard = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            statusDisplay.textContent = `Player ${currentPlayer}'s Turn`;
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('x', 'o');
            });
        }

        function updateScores() {
            xScoreDisplay.textContent = scores.x;
            oScoreDisplay.textContent = scores.o;
            drawScoreDisplay.textContent = scores.draw;
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
    </script>
</body>
</html>
